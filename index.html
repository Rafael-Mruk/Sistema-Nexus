<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWB Nexus | Sistema de Extração de Rastreios</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --cyan: #00f0ff;
    --blue: #0066ff;
    --purple: #7c3aed;
    --pink: #ff006e;
    --dark: #0a0a1a;
    --darker: #050510;
  }
  
  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--darker);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    color: #e0e0ff;
  }
  
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      linear-gradient(135deg, rgba(0, 102, 255, 0.08) 0%, transparent 50%, rgba(124, 58, 237, 0.08) 100%),
      repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(0, 240, 255, 0.03) 49px, rgba(0, 240, 255, 0.03) 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(0, 240, 255, 0.03) 49px, rgba(0, 240, 255, 0.03) 50px);
    z-index: -2;
    animation: gridMove 20s linear infinite;
  }
  
  body::after {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.08) 0%, transparent 60%);
    z-index: -1;
    animation: float 15s ease-in-out infinite;
  }
  
  @keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(50px, 50px); }
  }
  
  @keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-2%, 2%) rotate(1deg); }
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.05); }
    50% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.5), inset 0 0 30px rgba(0, 240, 255, 0.1); }
  }
  
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes scanLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  
  .container {
    max-width: 1280px;
    margin: 0 auto;
    position: relative;
  }
  
  .header {
    text-align: center;
    margin-bottom: 40px;
    padding: 30px 20px;
    position: relative;
    animation: slideUp 0.8s ease-out;
  }
  
  .header .logo {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--cyan) 0%, #fff 50%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    text-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
    margin-bottom: 8px;
  }
  
  .header .subtitle {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: var(--cyan);
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  
  .header .specs {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  
  .header .spec-item {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    padding: 6px 14px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 20px;
    background: rgba(0, 240, 255, 0.05);
    color: var(--cyan);
    letter-spacing: 1px;
  }
  
  .upload-area {
    position: relative;
    background: linear-gradient(135deg, rgba(10, 10, 40, 0.8) 0%, rgba(20, 10, 50, 0.8) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 60px 40px;
    text-align: center;
    margin-bottom: 30px;
    border: 2px solid rgba(0, 240, 255, 0.2);
    animation: glow 3s ease-in-out infinite, slideUp 0.8s ease-out 0.1s both;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .upload-area::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: scanLine 3s linear infinite;
  }
  
  .upload-area:hover {
    border-color: rgba(0, 240, 255, 0.6);
    transform: translateY(-4px);
    box-shadow: 0 20px 60px rgba(0, 240, 255, 0.2), inset 0 0 40px rgba(0, 240, 255, 0.05);
  }
  
  .upload-area.dragover {
    border-color: var(--cyan);
    background: linear-gradient(135deg, rgba(0, 100, 150, 0.3) 0%, rgba(50, 0, 100, 0.3) 100%);
    transform: scale(1.02);
  }
  
  .upload-area input[type="file"] { display: none; }
  
  .upload-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    position: relative;
  }
  
  .upload-icon svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
  }
  
  .upload-label {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);
    color: var(--dark);
    padding: 16px 40px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
    border: none;
  }
  
  .upload-label:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 30px rgba(0, 240, 255, 0.6);
  }
  
  .upload-hint {
    margin-top: 16px;
    color: rgba(200, 200, 255, 0.5);
    font-size: 13px;
    letter-spacing: 1px;
  }
  
  .file-name {
    margin-top: 20px;
    font-family: 'Orbitron', monospace;
    color: var(--cyan);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 10px 20px;
    background: rgba(0, 240, 255, 0.1);
    border-radius: 10px;
    display: inline-block;
    border: 1px solid rgba(0, 240, 255, 0.2);
  }
  
  .warning {
    background: linear-gradient(135deg, rgba(80, 20, 20, 0.9) 0%, rgba(120, 30, 30, 0.9) 100%);
    backdrop-filter: blur(10px);
    border-left: 4px solid #ff4444;
    color: #ffcccc;

    border-radius: 12px;

    animation: slideUp 0.5s ease-out;

  }
  .warning.show { display: block; }
  
  .summary {
    background: linear-gradient(135deg, rgba(10, 10, 40, 0.8) 0%, rgba(20, 10, 50, 0.8) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 25px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    display: none;

  .summary.show { display: block; }
  
  .summary h3 {
    font-family: 'Orbitron', monospace;
    color: var(--cyan);
    margin-bottom: 20px;
    font-size: 14px;
    letter-spacing: 3px;

    align-items: center;

  .summary h3::before {
    content: '';
    width: 4px;
    height: 16px;
    background: var(--cyan);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--cyan);
  }
  
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
  }
  
  .summary-card {
    position: relative;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.08) 0%, rgba(124, 58, 237, 0.08) 100%);

    border-radius: 12px;

    border: 1px solid rgba(0, 240, 255, 0.15);
    overflow: hidden;
    transition: all 0.3s;
  }
  
  .summary-card:hover {

    border-color: rgba(0, 240, 255, 0.4);
    box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);

  .summary-card::before {

  .phase-title {

    padding-bottom: 16px;

  .phase-badge {
    font-family: 'Orbitron', monospace;

    font-size: 11px;

    letter-spacing: 1.5px;

    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(234, 88, 12, 0.2) 100%);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.3);

  .phase-badge.transito {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(0, 102, 255, 0.2) 100%);

    background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.2) 100%);
    color: #f87171;
    border: 1px solid rgba(248, 113, 113, 0.3);

    color: rgba(180, 180, 220, 0.6);

    padding-left: 4px;

    margin-bottom: 15px;

  .carrier-logo {

    height: 38px;

    justify-content: center;

    font-weight: 900;
    font-size: 14px;
    letter-spacing: 1px;

  .carrier-logo.fedex {
    background: linear-gradient(135deg, #4D148C 0%, #6B21B8 100%);
    color: #FF6600;
    box-shadow: 0 4px 15px rgba(107, 33, 184, 0.4);
  }
  
  .carrier-logo.dhl {
    background: linear-gradient(135deg, #FFCC00 0%, #FFD633 100%);

    box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
  }
  
  .carrier-logo.ups {
    background: linear-gradient(135deg, #351C15 0%, #5C3328 100%);
    color: #FFB500;
    box-shadow: 0 4px 15px rgba(92, 51, 40, 0.4);
  }
  
  .carrier-name {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    color: #fff;
    font-size: 15px;
    letter-spacing: 1px;
  }
  
  .carrier-info {
    font-size: 12px;
    color: rgba(180, 180, 220, 0.6);

  }
  
  .carrier-info span {
    color: var(--cyan);

  }
  
  .batch-container {
    margin-left: 85px;
  }
  
  .batch {
    position: relative;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid rgba(0, 240, 255, 0.1);
    transition: all 0.3s;
  }
  
  .batch:hover {
    border-color: rgba(0, 240, 255, 0.3);
    background: rgba(0, 20, 40, 0.4);
  }
  
  .batch-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

  }
  
  .batch-title {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--cyan);
    letter-spacing: 1px;
    display: flex;
    align-items: center;

  .batch-title::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);

  }
  
  .copy-btn {
    font-family: 'Orbitron', monospace;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);

    border: none;
    padding: 8px 18px;
    border-radius: 20px;

    font-weight: 700;

  .copy-btn:hover {
    transform: translateY(-2px) scale(1.05);

  .awb-textarea {

    border-radius: 8px;

  .awb-textarea:focus {

  .empty-msg {

    width: 20px;
    height: 20px;

  .corner.tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }

<body>
<div class="container">
  <div class="header">
    <div class="logo">AWB NEXUS</div>
    <div class="subtitle">Sistema de Extração e Organização de Rastreios</div>
    <div class="specs">
      <span class="spec-item">FEDEX • 30/CONSULTA</span>
      <span class="spec-item">DHL • 10/CONSULTA</span>
      <span class="spec-item">UPS • 25/CONSULTA</span>
    </div>
  </div>

  <div class="upload-area" id="uploadArea">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <input type="file" id="fileInput" accept=".xls,.xlsx,.html">
    <div class="upload-icon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 15 L50 65 M30 45 L50 25 L70 45" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="15" y="70" width="70" height="15" rx="3" stroke="#00f0ff" stroke-width="2" fill="rgba(0,240,255,0.1)"/>
        <circle cx="50" cy="50" r="45" stroke="rgba(0,240,255,0.2)" stroke-width="1" fill="none" stroke-dasharray="5 5"/>
      </svg>
    </div>
    <label for="fileInput" class="upload-label">Carregar Planilha</label>
    <p class="upload-hint">ARRASTE E SOLTE O ARQUIVO AQUI • FORMATOS: .XLS / .XLSX</p>
    <div class="file-name" id="fileName"></div>
  </div>

  <div class="warning" id="warning"></div>

  <div class="summary" id="summary">
    <h3>Análise de Dados</h3>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div id="results"></div>
</div>

<script>
const UPLOAD_AREA = document.getElementById('uploadArea');
const FILE_INPUT = document.getElementById('fileInput');
const FILE_NAME = document.getElementById('fileName');
const WARNING = document.getElementById('warning');
const SUMMARY = document.getElementById('summary');
const SUMMARY_GRID = document.getElementById('summaryGrid');
const RESULTS = document.getElementById('results');

const FASES_PREPARACAO = [
  'etiqueta criada',
  'aguardando coleta',
  'coleta com excecao',
  'coletas reagendadas',
  'coletas em atraso',
  'ag atualizacao do rastreio'
];

const FASES_TRANSITO = [
  'em transito',
  'em rota de entrega'
];

const FASES_FINALIZADAS = [
  'envios finalizados',
  'envios retornados',
  'envios em atraso',
  'envios cancelados',
  'finalizado',
  'cancelado',
  'retornado'
];

const LIMITES = { FEDEX: 30, DHL: 10, UPS: 25 };

function normalize(str) {
  if (!str) return '';
  return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function hexToDec(hex) {
  try {
    const clean = String(hex).trim().toUpperCase().replace(/[^0-9A-F]/g, '');
    if (clean.length === 0) return null;
    let result = BigInt(0);
    for (let i = 0; i < clean.length; i++) {
      result = result * BigInt(16) + BigInt(parseInt(clean[i], 16));
    }
    return result.toString();
  } catch (e) { return null; }
}

function isHex(str) {
  if (!str) return false;
  const original = String(str).trim();
  // Rejeita strings que contenham caracteres típicos de datas ou horários
  if (/[\/\-\.:]/.test(original)) return false;
  const clean = original.toUpperCase().replace(/[^0-9A-F]/g, '');
  return clean.length >= 8 && /^[0-9A-F]+$/.test(clean);
}

function identifyCarrier(awb, transportadora) {
  const t = normalize(transportadora);
  if (t.includes('fedex')) return 'FEDEX';
  if (t.includes('dhl')) return 'DHL';
  if (t.includes('ups')) return 'UPS';
  const a = String(awb || '').trim().toUpperCase();
  if (a.startsWith('1Z')) return 'UPS';
  if (/^\d{10}$/.test(a)) return 'DHL';
  if (/^\d{12}$/.test(a)) return 'FEDEX';
  if (isHex(a)) return 'FEDEX';
  return null;
}

function processFedExAwb(awb) {
  const a = String(awb || '').trim().toUpperCase();
  if (/^\d{12}$/.test(a)) return { value: a, converted: false };
  if (isHex(a)) {
    const dec = hexToDec(a);
    if (dec) {
      const padded = dec.padStart(12, '0');
      return { value: padded.slice(-12), converted: true };
    }
  }
  const nums = a.replace(/\D/g, '');
  if (nums.length >= 12) return { value: nums.slice(-12), converted: false };
  return { value: a, converted: false };
}

function splitIntoBatches(awbs, limit) {
  const batches = [];
  for (let i = 0; i < awbs.length; i += limit) {
    batches.push(awbs.slice(i, i + limit));
  }
  return batches;
}

function classifyPhase(fase) {
  const f = normalize(fase);
  if (!f) return null;
  if (FASES_PREPARACAO.includes(f)) return 'preparacao';
  if (FASES_TRANSITO.includes(f)) return 'transito';
  if (f.includes('tratativa com suporte')) return 'suporte';
  if (FASES_FINALIZADAS.some(ff => f.includes(ff))) return 'finalizada';
  return null;
}

UPLOAD_AREA.addEventListener('click', () => FILE_INPUT.click());
UPLOAD_AREA.addEventListener('dragover', (e) => { e.preventDefault(); UPLOAD_AREA.classList.add('dragover'); });
UPLOAD_AREA.addEventListener('dragleave', () => UPLOAD_AREA.classList.remove('dragover'));
UPLOAD_AREA.addEventListener('drop', (e) => {
  e.preventDefault();
  UPLOAD_AREA.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    FILE_INPUT.files = e.dataTransfer.files;
    handleFile(e.dataTransfer.files[0]);
  }
});
FILE_INPUT.addEventListener('change', (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  FILE_NAME.textContent = 'PROCESSANDO: ' + file.name.toUpperCase();
  WARNING.classList.remove('show');
  SUMMARY.classList.remove('show');
  RESULTS.innerHTML = '';
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let workbook;
      const data = new Uint8Array(e.target.result);
      try {
        workbook = XLSX.read(data, { type: 'array' });
      } catch (xlsErr) {
        const html = new TextDecoder('utf-8').decode(data);
        workbook = XLSX.read(html, { type: 'string' });
      }
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
      FILE_NAME.textContent = 'ARQUIVO: ' + file.name.toUpperCase();
      processData(jsonData);
    } catch (err) {
      try {
        const html = new TextDecoder('utf-8').decode(e.target.result);
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const table = doc.querySelector('table');
        if (table) {
          FILE_NAME.textContent = 'ARQUIVO: ' + file.name.toUpperCase();
          processData(tableToJson(table));
        } else {
          showWarning('Erro ao processar o arquivo. Verifique se é uma planilha válida.');
          FILE_NAME.textContent = '';
        }
      } catch (err2) {
        showWarning('Erro ao processar o arquivo. Verifique se é uma planilha válida.');
        FILE_NAME.textContent = '';
        console.error(err, err2);
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

function tableToJson(table) {
  const rows = table.querySelectorAll('tr');
  const headers = [];
  rows[0].querySelectorAll('th, td').forEach(cell => headers.push(cell.textContent.trim()));
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const row = {};
    rows[i].querySelectorAll('td').forEach((cell, idx) => {
      row[headers[idx] || 'coluna_' + idx] = cell.textContent.trim();
    });
    data.push(row);
  }
  return data;
}

function findColumn(headers, keywords, excludeKeywords = []) {
  for (const h of headers) {
    const nh = normalize(h);
    let match = false;
    for (const kw of keywords) {
      if (nh.includes(normalize(kw))) {
        match = true;
        break;
      }
    }
    if (match) {
      let excluded = false;
      for (const ekw of excludeKeywords) {
        if (nh.includes(normalize(ekw))) {
          excluded = true;
          break;
        }
      }
      if (!excluded) return h;
    }
  }
  return null;
}

function processData(data) {
  if (!data || data.length === 0) {
    showWarning('A planilha está vazia ou não foi possível ler os dados.');
    return;
  }
  
  const headers = Object.keys(data[0]);
  const colFase = findColumn(headers, ['fase', 'status', 'etapa']);
  const colAwb = findColumn(headers, ['awb', 'nº awb', 'numero awb', 'tracking', 'rastreio']);
  const colTransportadora = findColumn(headers, ['transportadora', 'courier', 'transportador']);
  const colColeta = findColumn(headers, ['n° coleta', 'nº coleta', 'numero coleta', 'número coleta'], ['data', 'agendamento', 'horario', 'horário', 'endereço', 'endereco']);
  
  if (!colAwb) {
    showWarning('Não foi encontrada a coluna de AWB na planilha.');
    return;
  }
  
  let hasFinalizadas = false;
  const finalizadasEncontradas = new Set();
  const resultado = {
    preparacao: { FEDEX: [], DHL: [], UPS: [] },
    transito: { FEDEX: [], DHL: [], UPS: [] },
    suporte: { FEDEX: [], DHL: [], UPS: [] }
  };
  const totalPorTransportadora = { FEDEX: 0, DHL: 0, UPS: 0 };
  
  data.forEach(row => {
    const fase = colFase ? row[colFase] : '';
    const awbRaw = row[colAwb];
    const transportadora = colTransportadora ? row[colTransportadora] : '';
    const coleta = colColeta ? row[colColeta] : '';
    
    if (!awbRaw || String(awbRaw).trim() === '') return;
    
    const carrier = identifyCarrier(awbRaw, transportadora);
    if (!carrier) return;
    
    const faseClass = classifyPhase(fase);
    if (faseClass === 'finalizada') {
      hasFinalizadas = true;
      finalizadasEncontradas.add(String(fase).trim());
      return;
    }
    if (!faseClass) return;
    
    let awbInfo;
    if (carrier === 'FEDEX') {
      awbInfo = processFedExAwb(awbRaw);
      // Fallback: só tenta usar coluna de coleta se o AWB original NÃO for um formato válido
      // e se existir uma coluna de número de coleta (não data) identificada
      const awbStr = String(awbRaw || '').trim();
      const awbValido = /^\d{12}$/.test(awbStr.replace(/\D/g, '')) || isHex(awbStr);
      if (!awbValido && colColeta && isHex(coleta)) {
        const coletaDec = hexToDec(coleta);
        if (coletaDec) awbInfo = { value: coletaDec.padStart(12, '0').slice(-12), converted: true };
      }
    } else if (carrier === 'UPS') {
      awbInfo = { value: String(awbRaw).trim().toUpperCase(), converted: false };
    } else {
      const nums = String(awbRaw).replace(/\D/g, '');
      awbInfo = { value: nums.slice(-10), converted: false };
    }
    
    if (awbInfo.value && awbInfo.value.length > 0) {
      resultado[faseClass][carrier].push(awbInfo);
      totalPorTransportadora[carrier]++;
    }
  });
  
  if (hasFinalizadas) {
    showWarning('AVISO: Planilha enviada sem filtro de negócios em andamento. Envios com status "' + 
      Array.from(finalizadasEncontradas).join(', ') + '" foram ignorados.');
  }
  
  showSummary(totalPorTransportadora);
  renderResults(resultado);
}

function showSummary(totais) {
  SUMMARY_GRID.innerHTML = `
    <div class="summary-card">
      <div class="num">${totais.FEDEX}</div>
      <div class="lbl">FedEx</div>
    </div>
    <div class="summary-card">
      <div class="num">${totais.DHL}</div>
      <div class="lbl">DHL</div>
    </div>
    <div class="summary-card">
      <div class="num">${totais.UPS}</div>
      <div class="lbl">UPS</div>
    </div>
    <div class="summary-card">
      <div class="num">${totais.FEDEX + totais.DHL + totais.UPS}</div>
      <div class="lbl">Total</div>
    </div>
  `;
  SUMMARY.classList.add('show');
}

function showWarning(msg) {
  WARNING.textContent = msg;
  WARNING.classList.add('show');
}

function renderResults(resultado) {
  const secoes = [
    {
      key: 'preparacao',
      titulo: 'Preparação para Coleta',
      descricao: 'Etiqueta criada • Aguardando Coleta • Coleta com Exceção • Coletas Reagendadas • Coletas em Atraso • AG Atualização do Rastreio',
      badgeClass: 'preparacao'
    },
    {
      key: 'transito',
      titulo: 'Em Trânsito / Rota de Entrega',
      descricao: 'Em Trânsito • Em Rota de Entrega',
      badgeClass: 'transito'
    },
    {
      key: 'suporte',
      titulo: 'Tratativa com Suporte',
      descricao: 'Envios que necessitam de tratativa separada',
      badgeClass: 'suporte'
    }
  ];
  
  let html = '';
  secoes.forEach(secao => {
    const dados = resultado[secao.key];
    const totalSecao = dados.FEDEX.length + dados.DHL.length + dados.UPS.length;
    
    html += `
      <div class="phase-section">
        <div class="phase-title">
          <h2>${secao.titulo}</h2>
          <span class="phase-badge ${secao.badgeClass}">${totalSecao} AWBs</span>
        </div>
        <p class="phase-desc">${secao.descricao}</p>
    `;
    
    ['FEDEX', 'DHL', 'UPS'].forEach(carrier => {
      const awbs = dados[carrier];
      const limite = LIMITES[carrier];
      const lotes = splitIntoBatches(awbs, limite);
      const nomeCarrier = carrier === 'FEDEX' ? 'FedEx' : carrier;
      
      html += `<div class="carrier-group">
        <div class="carrier-header">
          <div class="carrier-logo ${carrier.toLowerCase()}">${carrier}</div>
          <div>
            <div class="carrier-name">${nomeCarrier}</div>
            <div class="carrier-info"><span>${awbs.length}</span> AWBs • <span>${lotes.length}</span> lote(s) • limite <span>${limite}</span>/consulta</div>
          </div>
        </div>`;
      
      if (awbs.length === 0) {
        html += `<div class="empty-msg">Nenhum AWB encontrado para ${nomeCarrier} nesta fase.</div>`;
      } else {
        html += `<div class="batch-container">`;
        lotes.forEach((lote, idx) => {
          const texto = lote.map(a => a.value).join('\n');
          const id = `${secao.key}_${carrier}_${idx}`;
          html += `
            <div class="batch">
              <div class="batch-header">
                <span class="batch-title">LOTE ${String(idx + 1).padStart(2, '0')} • ${lote.length} AWB(s)</span>
                <button class="copy-btn" onclick="copiarTexto('${id}', this)">Copiar</button>
              </div>
              <textarea class="awb-textarea" id="${id}" readonly>${texto}</textarea>
            </div>
          `;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });
  
  RESULTS.innerHTML = html;
}

function copiarTexto(id, btn) {
  const textarea = document.getElementById(id);
  textarea.select();
  document.execCommand('copy');
  const original = btn.textContent;
  btn.textContent = 'Copiado!';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 2000);
}
</script>
